# Server Configuration
server.port=9090

# Application Name
spring.application.name=hackerrank-log

# Logging
logging.level.root=INFO
logging.level.com.hackerrank.log=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# HackerRank Solutions Path
hackerrank.solution.path=/Users/yeob-eunjun/hackerrank-solutions

# Git Configuration
hackerrank.git.remote=origin
hackerrank.git.branch=main

# WebFlux (선택사항)
spring.webflux.base-path=/

# CORS (선택사항 - 모든 도메인 허용)
spring.webflux.cors.allowed-origins=*
spring.webflux.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.webflux.cors.allowed-headers=*

